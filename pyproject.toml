[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devasya-ai-backend"
version = "1.0.0"
description = "Devasya AI - Memory-driven intelligence system"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "psycopg[binary]==3.2.13",
    "python-dotenv==1.0.0",
    "pyjwt==2.8.0",
    "passlib==1.7.4",
    "bcrypt==4.1.1",
    "python-multipart==0.0.6",
    "httpx==0.25.2",
    "groq==0.4.2",
    "sentence-transformers==2.2.2",
    "chromadb==0.4.21",

    "langchain==0.1.20",
    "langchain-core==0.1.52",
    "langchain-openai==0.1.6",
    "langgraph==0.0.40",

    "redis==5.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "ruff==0.1.8"
]