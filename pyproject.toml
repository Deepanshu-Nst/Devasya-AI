[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devasya-ai-backend"
version = "1.0.0"
description = "Devasya AI - Memory-driven intelligence system"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "pyjwt==2.8.0",
    "passlib==1.7.4",
    "bcrypt==4.1.1",
    "python-multipart==0.0.6",
    "httpx==0.25.2",
    "openai==1.3.9",
    "groq==0.4.2",
    "sentence-transformers==2.2.2",
    "chromadb==0.4.21",
    "langgraph>=0.0.19",
    "langchain>=0.1.8",
    "langchain-core>=0.1.24",
    "langchain-openai>=0.0.8",
    "redis==5.0.1", 
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.12.0",
    "ruff==0.1.8",
]
